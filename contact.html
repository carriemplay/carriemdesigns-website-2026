<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Carrie Mah</title>
  <meta name="description" content="Reach out to Carrie Mah regarding Staff Product Designer, UX Design Lead, UX Manager roles, or portfolio access.">
  <!-- Google Fonts: Poppins, Inter, Caveat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-graph-paper">
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header" role="banner">
    <div class="container site-header__inner">
      <a href="index.html" class="brand-lockup" aria-label="Carrie Mah — Staff Product Designer &amp; Design Manager">
        <img src="assets/logo.png" alt="" class="brand-lockup__favicon" width="40" height="40" aria-hidden="true">
        <span class="brand-lockup__text">
          <span class="brand-lockup__title">Carrie Mah</span>
          <span class="brand-lockup__subtitle">Staff Product Designer &amp; Design Manager</span>
        </span>
      </a>

      <button
        type="button"
        class="menu-toggle"
        id="menu-toggle"
        aria-expanded="false"
        aria-controls="primary-nav"
        aria-label="Toggle navigation menu"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <nav id="primary-nav" class="site-nav" aria-label="Primary navigation">
        <ul class="site-nav__list">
          <li><a href="index.html#portfolio" class="site-nav__link">Work</a></li>
          <li><a href="portfolio.html" class="site-nav__link">Portfolio</a></li>
          <li><a href="about.html" class="site-nav__link">About</a></li>
          <li><a href="contact.html" class="site-nav__link is-active" aria-current="page">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1">
    <section class="contact-section bg-graph-paper" aria-labelledby="contact-heading">
      <div class="container">
        <div class="contact-card">
          <div class="contact-card__header">
            <h1 id="contact-heading" class="section-h2">Reach out</h1>
            <p class="lead-copy">Send a note about leadership opportunities, portfolio access, or collaboration.</p>
          </div>

          <div class="contact-form">
            <p class="lead-copy">You can reach me directly at <strong>contact[at]carriemah[dot]com</strong>.</p>

            <div class="btn-group">
              <button type="button" class="btn btn--primary" id="email-open-btn">Email me</button>
              <button type="button" class="btn btn--secondary" id="email-copy-btn">Copy email</button>
            </div>

            <div id="contact-feedback" class="form-feedback" role="status" aria-live="polite" hidden>
              <p id="contact-feedback-text"></p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div data-include="footer.html"></div>

  <script src="script.js"></script>
</body>
</html>
